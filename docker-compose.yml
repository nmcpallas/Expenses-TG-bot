services:
  postgres:
    image: postgres:15-alpine
    container_name: local-postgres
    environment:
      POSTGRES_DB: tg_budget
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5542:5432"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: expenses-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: minio/minio:latest
    container_name: expenses-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  analytics-service:
    build:
      context: ../Expense-analytics-service
    container_name: expense-analytics-service
    depends_on:
      - postgres
      - rabbitmq
      - minio
    environment:
      DATABASE_URL: postgresql://postgres:5432/tg_budget
      DATABASE_USERNAME: test
      DATABASE_PASSWORD: test
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      REPORTING_TIME_ZONE: Asia/Tashkent
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: expense-reports
      MINIO_REGION: us-east-1
      MINIO_SECURE: "false"
    ports:
      - "8081:8080"

volumes:
  minio_data:
