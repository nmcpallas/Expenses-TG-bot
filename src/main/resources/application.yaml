server:
  port: 8080

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%level%replace(%X{traceId}){'^(.+)$',' traceId=$1'} [%thread] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

spring:
  application.name: Expenses TG-bot
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:migrations
telegram:
  enabled: true
  bot:
    username: expenses_statistic_bot
    token: ${TG_BOT_TOKEN}

system:
  dispatcher-capacity: ${DISPATCHER-CAPACITY:100}
  chat-blocking-duration: ${CHAT_BLOCKING_DURATION:1000}

expense:
  ml:
    enabled: ${EXPENSE_ML_ENABLED:true}
    mock-enabled: ${EXPENSE_ML_MOCK_ENABLED:false}
    host: ${EXPENSE_ML_HOST:localhost}
    port: ${EXPENSE_ML_PORT:50051}
    deadline-ms: ${EXPENSE_ML_DEADLINE_MS:1500}
    training:
      cron: ${EXPENSE_ML_TRAINING_CRON:0 0 6 * * *}
      zone: ${EXPENSE_ML_TRAINING_ZONE:Asia/Tashkent}
