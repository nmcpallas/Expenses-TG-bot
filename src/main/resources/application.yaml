server:
  port: 8080

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%level%replace(%X{traceId}){'^(.+)$',' traceId=$1'} [%thread] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

spring:
  application.name: Expenses TG-bot
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:migrations
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: simple
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2s
          max-attempts: 5
          multiplier: 2
          max-interval: 30s
telegram:
  enabled: true
  bot:
    username: expenses_statistic_bot
    token: ${TG_BOT_TOKEN}

system:
  dispatcher-capacity: ${DISPATCHER-CAPACITY:100}
  chat-blocking-duration: ${CHAT_BLOCKING_DURATION:1000}

expense:
  admin:
    broadcast-token: ${EXPENSE_ADMIN_BROADCAST_TOKEN:}
  ml:
    enabled: ${EXPENSE_ML_ENABLED:true}
    mock-enabled: ${EXPENSE_ML_MOCK_ENABLED:false}
    host: ${EXPENSE_ML_HOST:localhost}
    port: ${EXPENSE_ML_PORT:50051}
    deadline-ms: ${EXPENSE_ML_DEADLINE_MS:1500}
    training:
      cron: ${EXPENSE_ML_TRAINING_CRON:0 0 6 * * *}
      zone: ${EXPENSE_ML_TRAINING_ZONE:Asia/Tashkent}
  reporting:
    enabled: ${EXPENSE_REPORTING_ENABLED:true}
    cron: ${EXPENSE_REPORTING_CRON:0 0 4 * * *}
    zone: ${EXPENSE_REPORTING_ZONE:Asia/Tashkent}
    artifact-max-bytes: ${EXPENSE_REPORT_ARTIFACT_MAX_BYTES:20971520}
  outbox:
    fixed-delay-ms: ${EXPENSE_OUTBOX_FIXED_DELAY_MS:1000}
  mini-app:
    url: ${MINI_APP_URL:}
    auth-max-age-seconds: ${MINI_APP_AUTH_MAX_AGE_SECONDS:3600}
    allowed-origins: ${MINI_APP_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  analytics:
    base-url: ${EXPENSE_ANALYTICS_BASE_URL:http://expense-analytics:8080}
  weekly-report:
    enabled: ${EXPENSE_WEEKLY_REPORT_ENABLED:true}
    cron: ${EXPENSE_WEEKLY_REPORT_CRON:0 0 10 * * MON}
    zone: ${EXPENSE_WEEKLY_REPORT_ZONE:Asia/Tashkent}
